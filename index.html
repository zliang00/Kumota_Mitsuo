<h1>雲田光男</h1>
<hr>
詳細は「<a href="keireki.html">経歴</a>」を参照
<hr>
『北海道文学大辞典』 p134 より<br><br>

雲田光男 くもたみつお 明42・12・29～（1909～）〔小説〕後志管内寿都町生まれ。本名久保田一雄。国鉄五稜郭工場に勤務時に函館短文芸社を創立、「短文芸」（のち「道南文学」と改題）を発刊。北川冬彦の「時間」、保高徳蔵の「文芸首都」などにも参加、詩、小説、随筆など多方面に書く。小説集「朱太川」（昭33、短文芸社）、「孤島」（昭36、同）。詩集「秋」（昭25、土曜詩学会）のほか、小説「山の風町の風」（昭38～39、「道南文学」）などがある。
